name: Build and publish BedrockMenuBridge
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['src/**', 'pom.xml', '.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress clean verify
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" target/BedrockMenuBridge.jar#BedrockMenuBridge.jar --title "BedrockMenuBridge $TAG" --generate-notes
