name: Build Bedrock Menu Bridge

on:
  pull_request:
    paths:
      - 'BedrockMenuBridge/**'
      - '.github/workflows/build-bedrock-menu-bridge.yml'
  push:
    branches:
      - 'codex/bedrock-menu-bridge'
    paths:
      - 'BedrockMenuBridge/**'
      - '.github/workflows/build-bedrock-menu-bridge.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress -f BedrockMenuBridge/pom.xml clean verify
